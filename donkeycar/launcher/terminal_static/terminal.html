<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal</title>
<link rel="stylesheet" href="/terminal/static/xterm.css">
<style>
html,body{margin:0;height:100%;background:var(--tbg,#101318);overflow:hidden}
#term{height:100%;padding:4px;box-sizing:border-box}
#term .xterm{height:100%}
/* 触屏长按复制：禁用 iOS 长按系统放大镜/呼出菜单，长按手势由页面自己处理 */
#term,.xterm{-webkit-touch-callout:none}
#termToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:rgba(28,32,40,.92);color:#e8edf2;font:13px system-ui,sans-serif;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99}
#termToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--tov,rgba(16,19,24,.85));color:var(--tovink,#8fa1b5);font-family:system-ui,sans-serif;font-size:14px;cursor:pointer;user-select:none;text-align:center;padding:0 16px}
#overlay[hidden]{display:none}
</style>
</head>
<body>
<div id="term"></div>
<div id="overlay" hidden></div>
<script src="/terminal/static/xterm.js"></script>
<script src="/terminal/static/addon-fit.js"></script>
<script>
(function(){
'use strict';

// ?title=ZCode&icon=zcode.png：自定义标签页标题与 favicon（默认 Terminal + 无图标）
(function(){
  try{
    var params=new URLSearchParams(location.search);
    var title=params.get('title');
    if(title){document.title=title;}
    var icon=params.get('icon');
    if(icon){
      var link=document.createElement('link');
      link.rel='icon';link.type='image/png';
      link.href='/terminal/static/'+encodeURIComponent(icon);
      document.head.appendChild(link);
    }
  }catch(e){}
})();

// 主题：?theme=light|dark & ?ui=cockpit|apple——跟随 Drifter Console 页面
// （DC 的 Serial 终端 iframe 会把当前页面主题拼进 URL）；缺省 cockpit-dark，
// 与历史配色逐值一致（launcher 菜单直开终端不带参数时保持原样）。
var TERM_THEMES={
  'cockpit-dark': {bg:'#101318',fg:'#e8edf2',cursor:'#5cc8ff',overlayBg:'rgba(16,19,24,.85)',overlayInk:'#8fa1b5'},
  'cockpit-light':{bg:'#f4f7f5',fg:'#1a2330',cursor:'#0c9bd6',overlayBg:'rgba(244,247,245,.88)',overlayInk:'#51637a'},
  'apple-dark':   {bg:'#000000',fg:'#f5f5f7',cursor:'#2997ff',overlayBg:'rgba(0,0,0,.82)',overlayInk:'#a1a1a6'},
  'apple-light':  {bg:'#f5f5f7',fg:'#1d1d1f',cursor:'#0066cc',overlayBg:'rgba(245,245,247,.88)',overlayInk:'#6e6e73'}
};
var termPalette=(function(){
  var ui='cockpit',theme='dark';
  try{
    var params=new URLSearchParams(location.search);
    if(params.get('ui')==='apple')ui='apple';
    if(params.get('theme')==='light')theme='light';
  }catch(e){}
  var key=ui+'-'+theme;
  document.documentElement.dataset.termTheme=key;
  return TERM_THEMES[key];
})();
(function(){
  var s=document.documentElement.style;
  s.setProperty('--tbg',termPalette.bg);
  s.setProperty('--tov',termPalette.overlayBg);
  s.setProperty('--tovink',termPalette.overlayInk);
})();

// 语言：与 Launcher 菜单页一致——显式存储优先，否则跟随浏览器语言
var uiLang=(function(){try{var v=localStorage.getItem('donkeydrifter.ui.lang');if(v==='zh'||v==='en')return v;}catch(e){}try{return String(navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en';}catch(e){return 'zh';}})();
var T={
  zh:{connecting:'正在连接上位机终端…',closed:'连接已断开',reconnecting:'正在重新连接会话…',newSession:'点击重连（将开启新会话）',copied:'已复制',copyFailed:'复制失败，请重试',lineCopied:'已复制整行'},
  en:{connecting:'Connecting to host terminal…',closed:'Disconnected',reconnecting:'Reconnecting session…',newSession:'Tap to reconnect (starts a new session)',copied:'Copied',copyFailed:'Copy failed, please retry',lineCopied:'Line copied'}
};
function t(k){return (T[uiLang]&&T[uiLang][k])||T.zh[k]||k;}
document.documentElement.lang=uiLang==='zh'?'zh-CN':'en';

var overlay=document.getElementById('overlay');
function showOverlay(msg){overlay.textContent=msg;overlay.hidden=false;}
function hideOverlay(){overlay.hidden=true;}
overlay.addEventListener('click',function(){
  // 手动重连：立即触发一次重连尝试（清掉排队中的退避定时器）
  if(reconnectTimer!==null){clearTimeout(reconnectTimer);reconnectTimer=null;}
  retries=0;
  connect();
});
overlay.textContent=t('connecting');
overlay.hidden=false;

var term=new Terminal({
  cursorBlink:true,
  fontSize:14,
  scrollback:5000,
  theme:{background:termPalette.bg,foreground:termPalette.fg,cursor:termPalette.cursor}
});
var fit=new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));

var ws=null;
var encoder=new TextEncoder();
function sendCtrl(o){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(o));}}

// 会话保持与重连（issue #173）：服务端建连后下发 session 帧告知会话 sid，
// 断线后带着 ?session=<sid> 自动退避重连，服务端接回原 PTY 并补发断线期间
// 的输出，现场不丢；只有 shell 退出（exit 帧）才停止自动重连
var lastSid=null;
var retries=0;
var reconnectTimer=null;
var exited=false;
// 主动关闭标志：pagehide（标签页/iframe 关闭、整页刷新）时置位，抑制
// 断线自动重连与重连 overlay——服务端已收到销毁通知，重连只会白开新会话
var intentionallyClosed=false;

// ?cmd=<...> 自动执行（launcher 菜单 8/9/10 新标签打开时带上的首行命令）：
// 连上 WebSocket 发完 hello 后，把解码后的命令作为输入发送（含换行触发执行），
// 并计入标签命名跟踪
var autoCmd=(function(){
  try{
    var m=/[?&]cmd=([^&]*)/.exec(location.search);
    if(!m)return null;
    return decodeURIComponent(m[1].replace(/\+/g,' '));
  }catch(e){return null;}
})();

// 标签页命名：跟踪当前输入行，回车时把第一个词（空格前内容）postMessage 给父页（Drifter Console）
// 全屏 TUI（备用屏幕缓冲区 ESC[?1049h/l，如 kimi/claude/codex）内的按键不计入，避免在 TUI 里输入时误改标签名
var lineBuf='';
var inAlt=false;
function scanAltScreen(buf){
  for(var i=0;i+7<buf.length;i++){
    if(buf[i]===0x1b&&buf[i+1]===91&&buf[i+2]===63&&buf[i+3]===49&&buf[i+4]===48&&buf[i+5]===52&&buf[i+6]===57){
      var e=buf[i+7];
      if(e===104){inAlt=true;lineBuf='';}
      else if(e===108){inAlt=false;lineBuf='';}
    }
  }
}
function commitLine(){
  var name=lineBuf.replace(/^\s+|\s+$/g,'').split(/\s+/)[0]||'';
  lineBuf='';
  if(name.length>16)name=name.slice(0,16);
  if(name){try{window.parent.postMessage({type:'donkeydrifter.term.name',name:name},'*');}catch(e){}}
}
function trackLine(d){
  if(inAlt){lineBuf='';return;}
  for(var i=0;i<d.length;i++){
    var ch=d.charAt(i);
    if(ch==='\r'||ch==='\n'){commitLine();}
    else if(ch==='\x7f'||ch==='\b'){lineBuf=lineBuf.slice(0,-1);}
    else if(ch==='\x03'||ch==='\x1b'){lineBuf='';}
    else if(ch>=' '){lineBuf+=ch;}
  }
}

term.onData(function(d){
  if(ws&&ws.readyState===WebSocket.OPEN){ws.send(encoder.encode(d));}
  trackLine(d);
});

// ===== 选择与复制（issue：DC 终端无法选择文字并复制）=====
// xterm 的选区画在自己的层里，浏览器原生复制（Ctrl+C/右键菜单）拿不到内容，
// 且 Ctrl+C 默认发送 SIGINT；触屏设备上 xterm 完全没有拖选能力。
// 这里补齐三条复制通路：
//   1) Ctrl+Shift+C / Ctrl+Insert（macOS 为 Cmd+Shift+C）→ 复制选区
//      Ctrl/Cmd+C 在有选区时复制，无选区时保持原行为发送 SIGINT
//   2) 右键：有选区时直接复制（与本地终端一致）
//   3) 触屏长按 550ms：选中按压处整行并复制
var toastTimer=null;
function toast(msg){
  var el=document.getElementById('termToast');
  if(!el){el=document.createElement('div');el.id='termToast';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},1600);
}
function copyText(text){
  return new Promise(function(resolve){
    function fallback(){
      try{
        var ta=document.createElement('textarea');
        ta.value=text;
        ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.focus();ta.select();
        var ok=document.execCommand('copy');
        ta.remove();
        resolve(ok);
      }catch(e){resolve(false);}
    }
    // 终端多经局域网 HTTP 访问（非 secure context，navigator.clipboard 不存在），必须留 execCommand 兜底
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){resolve(true);},fallback);
    }else fallback();
  });
}
function copySelection(){
  var s=term.getSelection();
  if(!s)return false;
  copyText(s).then(function(ok){toast(ok?t('copied'):t('copyFailed'));});
  return true;
}
// 捕获阶段拦截，stopPropagation 防止 xterm 把复制键当输入发给 shell
document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey;
  if(!mod)return;
  var k=e.key,shiftC=e.shiftKey&&(k==='C'||k==='c');
  if(shiftC||(e.ctrlKey&&k==='Insert')||((k==='c'||k==='C')&&term.hasSelection())){
    if(copySelection()){e.preventDefault();e.stopPropagation();}
  }
},true);
// 右键复制当前选区（无选区时保留浏览器默认菜单）
document.getElementById('term').addEventListener('contextmenu',function(e){
  if(term.hasSelection()){copySelection();e.preventDefault();}
});
// 触屏长按：选中按压处整行（高亮 + 复制）
function copyLineAt(x,y){
  try{
    var el=document.elementFromPoint(x,y);
    while(el&&!(el.parentElement&&el.parentElement.classList.contains('xterm-rows')))el=el.parentElement;
    if(!el)return;
    var rows=el.parentElement.children;
    var idx=Array.prototype.indexOf.call(rows,el);
    var buf=term._core.buffer;
    var line=buf.lines.get(buf.ydisp+idx);
    if(!line)return;
    var text=line.translateToString(true);
    if(!text)return;
    var len=line.translateToString(false).replace(/\s+$/,'').length;
    if(len>0)term.select(0,buf.ydisp+idx,len);
    copyText(text).then(function(ok){toast(ok?t('lineCopied'):t('copyFailed'));});
  }catch(e){/* 布局取行失败时静默，不打断触屏交互 */}
}
(function(){
  var el=document.getElementById('term');
  var timer=null,sx=0,sy=0,longFired=false;
  el.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    var p=e.touches[0];sx=p.clientX;sy=p.clientY;longFired=false;
    timer=setTimeout(function(){timer=null;longFired=true;copyLineAt(sx,sy);},550);
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(timer===null)return;
    var p=e.touches[0];
    if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10){clearTimeout(timer);timer=null;}
  },{passive:true});
  el.addEventListener('touchend',function(e){
    if(timer!==null){clearTimeout(timer);timer=null;}
    // 长按已处理，吞掉后续合成点击，避免误触 shell
    if(longFired){e.preventDefault();longFired=false;}
  });
})();

function connect(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/terminal/ws';
  if(lastSid)url+='?session='+encodeURIComponent(lastSid);
  ws=new WebSocket(url);
  ws.binaryType='arraybuffer';
  // #101：连接加 10s 超时——握手挂起（服务端忙/升级请求被挂起）时 onopen/onclose 都可能
  // 不触发，overlay 会无限期停在「正在连接」；超时后主动关闭走 onclose 统一退避重连
  var connectTimer=setTimeout(function(){
    if(ws.readyState===WebSocket.CONNECTING){
      try{ws.close();}catch(e){}
    }
  },10000);
  ws.onopen=function(){
    clearTimeout(connectTimer);
    try{fit.fit();}catch(e){}
    sendCtrl({type:'hello',cols:term.cols,rows:term.rows});
    if(autoCmd){
      ws.send(encoder.encode(autoCmd+'\n'));
      trackLine(autoCmd+'\n');
      autoCmd=null;
    }
    retries=0;
    hideOverlay();
    term.focus();
  };
  ws.onmessage=function(e){
    if(typeof e.data==='string'){
      try{
        var j=JSON.parse(e.data);
        if(j&&j.type==='session'){
          // 重连失败接回（会话已过期被销毁）时清屏，避免新旧两个 shell 的
          // 输出混在同一个滚动缓冲里
          if(lastSid!==null&&!j.reattached){term.reset();}
          lastSid=j.id;
        }else if(j&&j.type==='exit'){
          exited=true;
          showOverlay(t('closed')+' (exit '+j.code+') · '+t('newSession'));
        }
      }catch(_){/* 忽略非 JSON 文本帧 */}
      return;
    }
    var bytes=new Uint8Array(e.data);
    scanAltScreen(bytes);
    term.write(bytes);
  };
  // 链路断开（任何原因，含 TCP keepalive 判死）：自动退避重连接回原会话（issue #173），
  // shell 已退出（exit 帧）时不再重连
  ws.onclose=function(){
    clearTimeout(connectTimer);
    if(exited||intentionallyClosed)return;
    scheduleReconnect();
  };
  ws.onerror=function(){/* onclose 随后触发，统一在那里处理 */};
}

function scheduleReconnect(){
  showOverlay(t('reconnecting'));
  var delay=Math.min(10000,500*Math.pow(2,retries));
  retries++;
  reconnectTimer=setTimeout(function(){
    reconnectTimer=null;
    connect();
  },delay);
}

// 标签页从后台冻结中恢复 / 网络恢复时，立即重试，不等退避定时器到点
function retryNow(){
  if(ws&&ws.readyState===WebSocket.OPEN)return;
  if(reconnectTimer!==null){clearTimeout(reconnectTimer);reconnectTimer=null;connect();}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)retryNow();});
window.addEventListener('online',retryNow);

// 标签页/iframe 关闭、整页刷新（pagehide）：立即通知服务端销毁会话（杀 bash
// 及其运行的进程），不再等 15 分钟宽限期——宽限期只面向网络闪断/锁屏这类
// 异常断线（issue #173）。sendBeacon 在页面卸载过程中也能可靠发出；服务端
// WS close 帧路径是浏览器未发 beacon 时的兜底。event.persisted=true（页面
// 进入 bfcache 并未销毁）时跳过，避免浏览器前进/后退误杀会话。
window.addEventListener('pagehide',function(event){
  if(event.persisted)return;
  intentionallyClosed=true;
  if(reconnectTimer!==null){clearTimeout(reconnectTimer);reconnectTimer=null;}
  if(lastSid){
    try{navigator.sendBeacon('/terminal/kill?session='+encodeURIComponent(lastSid));}catch(e){}
  }
});

// 尺寸变化：iframe 尺寸变化会触发 window resize；ResizeObserver 更稳
var pendingResize=false;
function onResize(){
  if(pendingResize)return;
  pendingResize=true;
  requestAnimationFrame(function(){
    pendingResize=false;
    try{fit.fit();}catch(e){}
    sendCtrl({type:'resize',cols:term.cols,rows:term.rows});
  });
}
window.addEventListener('resize',onResize);
if(window.ResizeObserver){new ResizeObserver(onResize).observe(document.getElementById('term'));}

connect();
})();
</script>
</body>
</html>
