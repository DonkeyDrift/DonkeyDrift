<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal</title>
<link rel="stylesheet" href="/terminal/static/xterm.css">
<style>
html,body{margin:0;height:100%;background:#101318;overflow:hidden}
#term{height:100%;padding:4px;box-sizing:border-box}
#term .xterm{height:100%}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,19,24,.85);color:#8fa1b5;font-family:system-ui,sans-serif;font-size:14px;cursor:pointer;user-select:none;text-align:center;padding:0 16px}
#overlay[hidden]{display:none}
</style>
</head>
<body>
<div id="term"></div>
<div id="overlay" hidden></div>
<script src="/terminal/static/xterm.js"></script>
<script src="/terminal/static/addon-fit.js"></script>
<script>
(function(){
'use strict';
// 语言：与 Launcher 菜单页一致——显式存储优先，否则跟随浏览器语言
var uiLang=(function(){try{var v=localStorage.getItem('donkeydrifter.ui.lang');if(v==='zh'||v==='en')return v;}catch(e){}try{return String(navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en';}catch(e){return 'zh';}})();
var T={
  zh:{connecting:'正在连接上位机终端…',closed:'连接已断开',reconnect:'点击重连',failed:'连接失败',lost:'连接已断开 · 终端会话已丢失',newSession:'点击重连（将开启新会话）'},
  en:{connecting:'Connecting to host terminal…',closed:'Disconnected',reconnect:'Tap to reconnect',failed:'Connection failed',lost:'Disconnected · terminal session lost',newSession:'Tap to reconnect (starts a new session)'}
};
function t(k){return (T[uiLang]&&T[uiLang][k])||T.zh[k]||k;}
document.documentElement.lang=uiLang==='zh'?'zh-CN':'en';

var overlay=document.getElementById('overlay');
function showOverlay(msg){overlay.textContent=msg;overlay.hidden=false;}
function hideOverlay(){overlay.hidden=true;}
overlay.addEventListener('click',function(){location.reload();});
overlay.textContent=t('connecting');
overlay.hidden=false;

var term=new Terminal({
  cursorBlink:true,
  fontSize:14,
  scrollback:5000,
  theme:{background:'#101318',foreground:'#e8edf2',cursor:'#5cc8ff'}
});
var fit=new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));

var ws=null;
var encoder=new TextEncoder();
function sendCtrl(o){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(o));}}

// ?cmd=<...> 自动执行（launcher 菜单 8/9/10 新标签打开时带上的首行命令）：
// 连上 WebSocket 发完 hello 后，把解码后的命令作为输入发送（含换行触发执行），
// 并计入标签命名跟踪
var autoCmd=(function(){
  try{
    var m=/[?&]cmd=([^&]*)/.exec(location.search);
    if(!m)return null;
    return decodeURIComponent(m[1].replace(/\+/g,' '));
  }catch(e){return null;}
})();

// 标签页命名：跟踪当前输入行，回车时把第一个词（空格前内容）postMessage 给父页（Drifter Console）
// 全屏 TUI（备用屏幕缓冲区 ESC[?1049h/l，如 kimi/claude/codex）内的按键不计入，避免在 TUI 里输入时误改标签名
var lineBuf='';
var inAlt=false;
function scanAltScreen(buf){
  for(var i=0;i+7<buf.length;i++){
    if(buf[i]===0x1b&&buf[i+1]===91&&buf[i+2]===63&&buf[i+3]===49&&buf[i+4]===48&&buf[i+5]===52&&buf[i+6]===57){
      var e=buf[i+7];
      if(e===104){inAlt=true;lineBuf='';}
      else if(e===108){inAlt=false;lineBuf='';}
    }
  }
}
function commitLine(){
  var name=lineBuf.replace(/^\s+|\s+$/g,'').split(/\s+/)[0]||'';
  lineBuf='';
  if(name.length>16)name=name.slice(0,16);
  if(name){try{window.parent.postMessage({type:'donkeydrifter.term.name',name:name},'*');}catch(e){}}
}
function trackLine(d){
  if(inAlt){lineBuf='';return;}
  for(var i=0;i<d.length;i++){
    var ch=d.charAt(i);
    if(ch==='\r'||ch==='\n'){commitLine();}
    else if(ch==='\x7f'||ch==='\b'){lineBuf=lineBuf.slice(0,-1);}
    else if(ch==='\x03'||ch==='\x1b'){lineBuf='';}
    else if(ch>=' '){lineBuf+=ch;}
  }
}

term.onData(function(d){
  if(ws&&ws.readyState===WebSocket.OPEN){ws.send(encoder.encode(d));}
  trackLine(d);
});

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/terminal/ws');
  ws.binaryType='arraybuffer';
  ws.onopen=function(){
    try{fit.fit();}catch(e){}
    sendCtrl({type:'hello',cols:term.cols,rows:term.rows});
    if(autoCmd){
      ws.send(encoder.encode(autoCmd+'\n'));
      trackLine(autoCmd+'\n');
      autoCmd=null;
    }
    hideOverlay();
    term.focus();
  };
  ws.onmessage=function(e){
    if(typeof e.data==='string'){
      try{var j=JSON.parse(e.data);if(j&&j.type==='exit'){showOverlay(t('closed')+' (exit '+j.code+') · '+t('reconnect'));}}catch(_){/* 忽略非 JSON 文本帧 */}
      return;
    }
    var bytes=new Uint8Array(e.data);
    scanAltScreen(bytes);
    term.write(bytes);
  };
  // 链路断开：PTYShell 会话已随连接被服务端回收，明确提示现场丢失，
  // 避免误以为"点击重连"能恢复原会话（issue #151）
  ws.onclose=function(){showOverlay(t('lost')+' · '+t('newSession'));};
  ws.onerror=function(){/* onclose 随后触发，统一在那里处理 */};
}

// 尺寸变化：iframe 尺寸变化会触发 window resize；ResizeObserver 更稳
var pendingResize=false;
function onResize(){
  if(pendingResize)return;
  pendingResize=true;
  requestAnimationFrame(function(){
    pendingResize=false;
    try{fit.fit();}catch(e){}
    sendCtrl({type:'resize',cols:term.cols,rows:term.rows});
  });
}
window.addEventListener('resize',onResize);
if(window.ResizeObserver){new ResizeObserver(onResize).observe(document.getElementById('term'));}

connect();
})();
</script>
</body>
</html>
