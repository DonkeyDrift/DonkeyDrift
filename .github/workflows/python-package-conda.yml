name: Python package and test DonkeyDrift

on:
  push:
  pull_request:

jobs:
  checkout-test:
    name: Checkout and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-latest"]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    env:
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create python 3.11 conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.11
          activate-environment: donkey
          auto-activate-base: false
          channels: default, conda-forge, pytorch
          channel-priority: true
      - name: Conda info and list
        run: |
          conda info
          conda list
      - name: Install DonkeyDrift
        run: |
          pip install -e .[dev]
          pip install -r web_ui/backend/requirements.txt
          pip install \
            opencv-python-headless matplotlib plotly albumentations \
            "pandas==3.0.3" "tensorflow==2.15.1"
          pip install build
          pip list
      - name: Install simulator test dependency
        run: |
          python -m pip install \
            "gym-donkeycar @ git+https://github.com/tawnkramer/gym-donkeycar@a1f4ca6961e17a6929c1f2e883358a1edafb479d"
          SITE_PACKAGES="$(python -c 'import gym_donkeycar, pathlib; print(pathlib.Path(gym_donkeycar.__file__).resolve().parent.parent)')"
          patch -p1 -d "$SITE_PACKAGES" \
            < scripts/patches/gym-donkeycar-linux-resilience.patch
      - name: Verify DonkeyDrift imports
        run: |
          python -c "import donkeydrifter; from donkeydrifter import Vehicle"
          python -c "import donkeycar; from donkeycar import Vehicle"
      - name: Build package
        run: python -m build --sdist --wheel
      - name: Run tests
        run: pytest
      - name: Run backend contract tests
        run: |
          cd web_ui/backend
          pip install -r requirements.txt
          python -m pytest tests -q

      - name: Run drift controller simulation
        run: |
          cd web_ui/backend
          python -m pytest tests/test_drift_controller.py -q
          cd ../../
          python scripts/simulate_drift_controller.py --beta-target 25 --duration 10
