<!doctype html>
<html lang="en" class="theme-mus4">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DonkeyDrift Web UI</title>
    <script>
      // 首屏防闪烁：渲染前按系统深浅色（prefers-color-scheme）直接解析，不读任何存储；
      // 因此每次进入/刷新都会重新跟随系统。matchMedia 不可用时回退深色。
      (function () {
        try {
          var m =
            typeof window.matchMedia === 'function'
              ? window.matchMedia('(prefers-color-scheme: dark)')
              : null;
          var t = m === null || m.matches ? 'dark' : 'light';
          document.documentElement.classList.remove('theme-mus4', 'theme-light');
          document.documentElement.classList.add(t === 'light' ? 'theme-light' : 'theme-mus4');
        } catch (e) {
          /* matchMedia 不可用时保持默认深色 */
        }
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
