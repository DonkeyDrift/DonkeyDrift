[metadata]
name = donkeydrifter
version = attr: donkeycar._version.__version__
author = Haobot
author_email = haobot2018@gmail.com
url = https://github.com/DonkeyDrift/DonkeyDrift
description = DonkeyDrift autonomous driving and drifting robotics platform derived from Donkeycar.
long_description = file: README.md
long_description_content_type = text/markdown
keywords = autonomous driving robotics drifting donkeydrifter donkeycar diyrobocars
license = Apache-2.0
classifiers =
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    Development Status :: 4 - Beta
    # Indicate who your project is intended for
    Intended Audience :: Developers
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: Apache Software License

[options]
packages = find_namespace:
zip_safe = True
include_package_data = True
python_requires = >=3.10.0,<3.13
install_requires =
    numpy
    pillow
    docopt
    tornado
    requests
    PrettyTable
    paho-mqtt
    simple_pid
    progress
    pyfiglet
    psutil
    pynmea2
    pyserial
    utm
    pandas
    pyyaml
    rich
    paramiko
    gymnasium
    pygame
    websockets
    aiortc
    av

[options.package_data]
* = *.html, *.ini, *.txt, *.kv

[options.extras_require]
pc =
    # 上限锁在 2.20 以下: TF 2.20 的新 tflite 解释器不再支持 Flex(SELECT_TF_OPS) 算子,
    # LSTM / 3D-CNN 模型转换后推理会 RuntimeError(FlexTensorListReserve). 见 MIGRATION-py312.md
    tensorflow>=2.19,<2.20
    tf-keras
    matplotlib
    kivy
    kivy-garden.matplotlib
    pandas
    plotly
    albumentations
    fastapi
    uvicorn
    python-multipart
macos =
    tensorflow==2.15.*
    tensorflow-metal
    matplotlib
    kivy
    kivy-garden.matplotlib
    pandas
    plotly
    albumentations
    fastapi
    uvicorn
    python-multipart
pi =
    picamera2
    Adafruit_PCA9685
    adafruit-circuitpython-ssd1306
    adafruit-circuitpython-rplidar
    RPi.GPIO
    flatbuffers==24.3.*
    tensorflow-aarch64==2.15.*
    opencv-contrib-python
    matplotlib
    kivy
    kivy-garden.matplotlib
    pandas
    plotly
    albumentations
nano =
    Adafruit_PCA9685
    adafruit-circuitpython-ssd1306
    adafruit-circuitpython-rplidar
    Jetson.GPIO
    numpy==1.23.*
    matplotlib==3.7.*
    kivy
    kivy-garden.matplotlib
    plotly
    pandas==2.0.*
dev =
    pytest
    pytest-cov
    responses
    mypy
torch =
    torch==2.1.*
    pytorch-lightning
    torchvision
    torchaudio
    fastai<2.8
fastapi-backend =
    fastapi
    uvicorn
    python-multipart
    websockets

[options.entry_points]
console_scripts =
    donkey = donkeycar.management.base:execute_from_command_line
